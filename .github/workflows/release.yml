name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v0.1.0"
        required: true
        type: string
      draft:
        description: "Create the GitHub release as a draft"
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            runner: macos-latest
            args: "--target universal-apple-darwin"
            rustTargets: "x86_64-apple-darwin,aarch64-apple-darwin"
          - name: Windows NSIS
            runner: windows-latest
            args: "--bundles nsis"
            rustTargets: ""
          - name: Linux AppImage and deb
            runner: ubuntu-22.04
            args: "--bundles appimage,deb"
            rustTargets: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Svelte checks
        run: npm run check

      - name: Run Rust checks
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Codex History Manager ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: "Unsigned multi-platform build. Download the asset for your platform."
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.draft || true }}
          prerelease: false
          args: ${{ matrix.args }}
